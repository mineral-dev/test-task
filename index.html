<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Task</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      padding: 3rem;
      max-width: 600px;
      width: 90%;
    }

    .card {
      padding: 2rem 2.5rem;
      border-radius: 16px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card--codex {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 150, 200, 0.1));
      box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2);
    }

    .card--codex:hover {
      box-shadow: 0 16px 48px rgba(0, 212, 255, 0.35);
    }

    .card--claude {
      background: linear-gradient(135deg, rgba(208, 132, 255, 0.15), rgba(150, 80, 220, 0.1));
      box-shadow: 0 8px 32px rgba(208, 132, 255, 0.2);
    }

    .card--claude:hover {
      box-shadow: 0 16px 48px rgba(208, 132, 255, 0.35);
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1rem;
    }

    .badge--codex {
      background: rgba(0, 212, 255, 0.2);
      color: #00d4ff;
      border: 1px solid rgba(0, 212, 255, 0.4);
    }

    .badge--claude {
      background: rgba(208, 132, 255, 0.2);
      color: #d084ff;
      border: 1px solid rgba(208, 132, 255, 0.4);
    }

    .card__text {
      font-size: 1.4rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card card--codex">
      <span class="badge badge--codex">Codex</span>
      <p class="card__text">this is generated by codex</p>
    </div>
    <div class="card card--claude">
      <span class="badge badge--claude">Claude</span>
      <p class="card__text">this is generated by claude</p>
    </div>
  </div>
</body>
</html>
